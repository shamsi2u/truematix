<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Page not found — TrueMatix</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0E1A;--paper:#F5F3EF;--muted:#9AA0BD;--violet:#6C4BF6;--violet-2:#9E86FF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;
min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.6}
.eyebrow{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
letter-spacing:.18em;text-transform:uppercase;color:var(--violet-2)}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,6vw,52px);
letter-spacing:-.02em;line-height:1.05;margin:16px 0 14px}
p{color:var(--muted);max-width:44ch;margin:0 auto 30px}
a{display:inline-block;background:var(--violet);color:#fff;text-decoration:none;
padding:14px 24px;border-radius:10px;font-weight:600;font-size:15px}
a:hover{background:#5a3ce0}
</style></head>
<body><main>
<span class="eyebrow">Error 404</span>
<h1>That page isn't here.</h1>
<p>The link may be out of date or mistyped. Head back to the homepage to find what you need.</p>
<a href="/">Go to homepage &rarr;</a>
</main></body></html>
